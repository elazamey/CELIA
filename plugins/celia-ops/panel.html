<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CELIA Studio — Orca Panel</title>
    <style>
      :root {
        --gold: #d4af37;
        --gold-soft: rgba(212, 175, 55, 0.14);
        --bg: var(--background, #0f0f12);
        --fg: var(--foreground, #f5f3ef);
        --muted: var(--muted-foreground, #9e9a93);
        --card: var(--secondary, #18181d);
        --line: var(--border, #2c2b33);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        font-size: 13px;
        line-height: 1.55;
        color: var(--fg);
        background: var(--bg);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 10px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: var(--gold);
        background: var(--gold-soft);
        border: 1px solid rgba(212, 175, 55, 0.35);
      }
      h1 {
        font-size: 14px;
        margin: 0;
        letter-spacing: 0.04em;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .card-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--gold);
        margin: 0 0 6px;
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
      label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin: 8px 0 4px;
      }
      select,
      button {
        width: 100%;
        font: inherit;
        border-radius: 8px;
      }
      select {
        padding: 7px 9px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        direction: ltr;
      }
      .btn-grid {
        display: grid;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        text-align: right;
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--fg);
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      button:hover {
        border-color: var(--gold);
        background: var(--gold-soft);
      }
      button.primary {
        text-align: center;
        font-weight: 600;
        border-color: rgba(212, 175, 55, 0.5);
        background: var(--gold-soft);
      }
      .cmd-hint {
        display: block;
        font-size: 11px;
        color: var(--muted);
        direction: ltr;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin-top: 2px;
      }
      .status {
        margin: 8px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px dashed var(--line);
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <h1>CELIA STUDIO</h1>
        <span class="badge">Orca Plugin</span>
      </div>
      <button id="refresh" class="primary" style="width: auto; padding: 4px 10px; font-size: 11px">
        تحديث السياق
      </button>
    </div>

    <div class="card">
      <p class="card-title">مسار العمل النشط (Active Worktree)</p>
      <p class="meta" id="worktree-info">اضغط «تحديث السياق» لقراءة الفرع والطرفيات المفتوحة.</p>
      <label for="terminals">اختر الطرفية المستهدفة (Explicit Terminal):</label>
      <select id="terminals">
        <option value="">— بانتظار قراءة الطرفيات —</option>
      </select>
    </div>

    <div class="card">
      <p class="card-title">أوامر سريعة لمنظومة CELIA</p>
      <div class="btn-grid">
        <button data-cmd="bash scripts/celia-doctor.sh && npm test">
          فحص صحة المنظومة والاختبارات
          <span class="cmd-hint">bash scripts/celia-doctor.sh && npm test</span>
        </button>
        <button data-cmd="npm run hub">
          تشغيل لوحة قيادة CELIA التفاعلية
          <span class="cmd-hint">npm run hub</span>
        </button>
        <button data-cmd="node scripts/celia-orchestrator.mjs status">
          عرض خريطة خدمات ومستودعات CELIA
          <span class="cmd-hint">node scripts/celia-orchestrator.mjs status</span>
        </button>
        <button data-cmd="node scripts/celia-orchestrator.mjs plan seasonal-collection-launch">
          توليد خطة إطلاق تشكيلة أزياء متوازية
          <span class="cmd-hint">node scripts/celia-orchestrator.mjs plan seasonal-collection-launch</span>
        </button>
        <button data-cmd="bash scripts/orca-sync.sh status">
          فحص حالة مصدر stablyai/orca والمهارات
          <span class="cmd-hint">bash scripts/orca-sync.sh status</span>
        </button>
      </div>
    </div>

    <button id="notify-ready" class="primary">إرسال إشعار جاهزية المراجعة</button>
    <p class="status" id="status">جاهز للعمل داخل Orca.</p>

    <script>
      'use strict'
      var seq = 0
      var pending = new Map()
      var statusEl = document.getElementById('status')
      var infoEl = document.getElementById('worktree-info')
      var selectEl = document.getElementById('terminals')

      function callHost(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'celia-req-' + ++seq
          var timer = setTimeout(function () {
            if (!pending.has(requestId)) return
            pending.delete(requestId)
            resolve({
              ok: false,
              error: 'انتهت مهلة الاتصال بمضيف Orca (تأكد من فتح اللوحة داخل تطبيق Orca أو المعاينة الحية).'
            })
          }, 4000)

          pending.set(requestId, function (data) {
            clearTimeout(timer)
            resolve(data)
          })

          window.parent.postMessage(
            {
              type: 'orca-panel-action',
              requestId: requestId,
              action: action,
              params: params || {}
            },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        var data = event.data
        if (event.source !== window.parent || !data || data.type !== 'orca-panel-action-result') {
          return
        }
        var handler = pending.get(data.requestId)
        if (!handler) return
        pending.delete(data.requestId)
        handler(data)
      })

      function refreshContext() {
        statusEl.textContent = 'جارٍ قراءة سياق المسار...'
        callHost('workspace.readContext', {}).then(function (result) {
          if (!result.ok) {
            statusEl.textContent = 'تعذر قراءة السياق: ' + (result.error || result.errorCode)
            return
          }
          if (!result.value) {
            infoEl.textContent = 'لا يوجد مسار عمل (Worktree) محدد حالياً.'
            statusEl.textContent = 'افتح مسار عمل لمشروع CELIA ثم أعد المحاولة.'
            return
          }
          var ctx = result.value
          infoEl.textContent =
            'المسار: ' + (ctx.displayName || 'CELIA') + ' — الفرع: ' + (ctx.branch || 'main')
          selectEl.innerHTML = ''
          var terminals = Array.isArray(ctx.terminals) ? ctx.terminals : []
          if (terminals.length === 0) {
            var emptyOpt = document.createElement('option')
            emptyOpt.value = ''
            emptyOpt.textContent = 'لا توجد طرفيات مفتوحة في هذا المسار'
            selectEl.appendChild(emptyOpt)
          } else {
            terminals.forEach(function (term, idx) {
              var opt = document.createElement('option')
              opt.value = term.id
              opt.textContent = (term.title ? term.title + ' — ' : 'Terminal #' + (idx + 1) + ' — ') + term.id
              selectEl.appendChild(opt)
            })
          }
          statusEl.textContent = 'تم تحديث السياق (' + terminals.length + ' طرفية متاحة).'
        })
      }

      document.getElementById('refresh').addEventListener('click', refreshContext)

      Array.prototype.forEach.call(document.querySelectorAll('button[data-cmd]'), function (btn) {
        btn.addEventListener('click', function () {
          var cmd = btn.getAttribute('data-cmd')
          var terminalId = selectEl.value
          if (!terminalId) {
            statusEl.textContent = 'اختر طرفية أولاً بعد الضغط على «تحديث السياق».'
            return
          }
          callHost('terminal.sendText', {
            terminalId: terminalId,
            text: cmd,
            enter: true
          }).then(function (result) {
            statusEl.textContent = result.ok
              ? 'تم إرسال الأمر إلى الطرفية: ' + cmd
              : 'فشل الإرسال: ' + (result.error || result.errorCode)
          })
        })
      })

      document.getElementById('notify-ready').addEventListener('click', function () {
        callHost('notifications.show', {
          title: 'CELIA Fashion Wear',
          body: 'المسار الحالي جاهز للمراجعة البصرية والاختبار قبل الدمج.'
        }).then(function (result) {
          statusEl.textContent = result.ok
            ? 'تم إرسال إشعار سطح المكتب بنجاح.'
            : 'تعذر إرسال الإشعار: ' + (result.error || result.errorCode)
        })
      })

      refreshContext()
    </script>
  </body>
</html>
